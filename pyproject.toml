    "seaborn>=0.13.2",
    "skl2onnx>=1.18.0",
    "onnxruntime>=1.20.1",
    "skops>=0.11.0",
    "keras>=3.9.1",
    "kaleido==0.2.1",
    "plotly==6.1.0",
    "pydot>=4.0.1",
    "torch==2.11.0+cpu",
    "torchvision==0.26.0+cpu",
